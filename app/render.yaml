# Render blueprint — AgentDesk staging (Testnet)
# Deploy: push app/ to GitHub, connect the repo in Render, "New + → Blueprint",
# or create the Web Service manually with the same values below.
# Zero npm dependencies, so there is no build step: `node server.js` is the
# whole start command. Render injects PORT; config.js already reads it.
# Repo is connected in the Render dashboard when creating the service
# (imnotripper/agentdesk, branch main) — render.yaml takes no repo field.
services:
  - type: web
    name: agentdesk-staging
    env: node
    plan: free
    rootDir: app
    startCommand: node server.js
    envVars:
      - key: SANDBOX
        value: "true"
      - key: PI_API_KEY
        value: ""
      # LLM keys for the worker (Groq primary, Gemini fallback — wired
      # 2026-11-26). Keys are NOT in the repo: paste them in the Render
      # dashboard (Environment) at deploy time. Empty = placeholder
      # generator, so the staging demo would show placeholder text.
      - key: LLM_API_KEY
        value: ""
      - key: LLM_FALLBACK_API_KEY
        value: ""
      - key: SESSION_SECRET
        generateValue: true
